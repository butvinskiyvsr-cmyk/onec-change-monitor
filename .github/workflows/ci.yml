name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - name: Publish Windows desktop app
        run: dotnet publish src/OneCChangeMonitor.Desktop/OneCChangeMonitor.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/configscope-win-x64
      - name: Package Windows desktop app
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/configscope-win-x64/* -DestinationPath artifacts/ConfigScope-win-x64.zip -Force
          $hash = (Get-FileHash artifacts/ConfigScope-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content artifacts/ConfigScope-win-x64.zip.sha256 "$hash  ConfigScope-win-x64.zip"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/OneCChangeMonitor.iss
          $installer = "artifacts/installer/ConfigScope-Setup-0.3.0.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$installer.sha256" "$hash  ConfigScope-Setup-0.3.0.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: onec-change-monitor-win-x64
          path: |
            artifacts/configscope-win-x64/ConfigScope.exe
            artifacts/configscope-win-x64/appsettings.Local.example.json
            artifacts/ConfigScope-win-x64.zip
            artifacts/ConfigScope-win-x64.zip.sha256
            artifacts/installer/ConfigScope-Setup-0.3.0.exe
            artifacts/installer/ConfigScope-Setup-0.3.0.exe.sha256
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag artifacts/ConfigScope-win-x64.zip artifacts/ConfigScope-win-x64.zip.sha256 artifacts/installer/ConfigScope-Setup-0.3.0.exe artifacts/installer/ConfigScope-Setup-0.3.0.exe.sha256 --generate-notes --title "ConfigScope $tag"
